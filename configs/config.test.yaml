# Test overlay — applied only when --env=test or APP_ENV=test
# and the primary config file is config.yaml.
# Keep sparse: only must-have / recommended overrides. No secrets. No app.env.

http:
  enabled: true
  port: 8081
  shutdown_timeout: 5

log:
  level: warn
  format: json
  output: stdout

database:
  driver: sqlite
  database: ":memory:"
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime: 60
