version: "2"
run:
  timeout: 5m
linters:
  # standard defaults (errcheck, govet, ineffassign, staticcheck, unused) stay on.
  # Extra linters align with template rules (error wrapping, HTTP, security, complexity).
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - gosec
    - misspell
    - nilerr
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocyclo:
      min-complexity: 25
    govet:
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - errorlint
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: test/
      # CLI: keep errcheck for Close/asserts; skip gosec path noise.
      - linters:
          - gosec
        path: cmd/
      # Codegen / large generated-style helpers.
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - staticcheck
        path: internal/database/gen/
      - linters:
          - gosec
        path: internal/database/migrate/
      # Config Validate is enum/switch-heavy by nature.
      - linters:
          - gocyclo
        path: internal/config/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
